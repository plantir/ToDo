[package]
name = "task-calendar"
version = "0.1.0"
description = "تقویم تسک — task calendar and Pomodoro desktop app"
authors = ["plantir"]
edition = "2021"

[lib]
name = "task_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
